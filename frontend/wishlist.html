<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Wishlist | StyleHub</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="canonical" href="http://127.0.0.1:8000/frontend/wishlist.html">
    <meta name="description" content="View and manage your saved garments, tailoring, and footwear in your StyleHub personal wishlist.">
</head>
<body>
    <div class="top-bar">
        <span>Complimentary express delivery on all orders over $150</span>
    </div>

    <!-- Public Header -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="/frontend/index.html" class="brand-logo" aria-label="StyleHub Home">
                <span class="brand-badge">SH</span>
                <span>StyleHub</span>
            </a>

            <nav class="nav-menu" aria-label="Main Navigation">
                <a href="/frontend/index.html" class="nav-link">Home</a>
                <a href="/frontend/products.html" class="nav-link">Products</a>
                <a href="/frontend/index.html#categories" class="nav-link">Categories</a>
                <a href="/frontend/wishlist.html" class="nav-link active">Wishlist</a>
                <a href="/frontend/cart.html" class="nav-link">Cart</a>
            </nav>

            <div class="nav-actions">
                <div id="nav-auth-container">
                    <a href="/frontend/login.html" class="nav-action-btn">
                        <span>👤</span>
                        <span>Login</span>
                    </a>
                </div>
                <button type="button" class="mobile-menu-toggle" aria-label="Toggle navigation">☰</button>
            </div>
        </div>
    </header>

    <main class="container py-8" id="wishlist-main-container">
        <div class="section-header">
            <div>
                <h1 class="page-title">Saved Wishlist</h1>
                <p class="page-subtitle" id="wishlist-count-subtitle">Pieces curated for your future wardrobe</p>
            </div>
            <a href="/frontend/products.html" class="link-primary">Explore More →</a>
        </div>

        <div id="wishlist-alert" class="alert is-hidden" role="alert"></div>

        <!-- Skeleton Grid -->
        <div id="wishlist-skeleton-view" class="product-grid">
            <div class="skeleton-card">
                <div class="skeleton-media"></div>
                <div class="skeleton-line skeleton-title"></div>
                <div class="skeleton-line skeleton-price"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-media"></div>
                <div class="skeleton-line skeleton-title"></div>
                <div class="skeleton-line skeleton-price"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-media"></div>
                <div class="skeleton-line skeleton-title"></div>
                <div class="skeleton-line skeleton-price"></div>
            </div>
        </div>

        <!-- Wishlist Content Grid -->
        <div id="wishlist-content-view" class="product-grid is-hidden"></div>
    </main>

    <!-- Public Footer -->
    <footer class="site-footer">
        <div class="container footer-bottom">
            <div>&copy; 2026 StyleHub Fashion Retail Ltd. All rights reserved.</div>
            <div>Saved Favourites & Wardrobe Curator.</div>
        </div>
    </footer>

    <script src="/frontend/js/main.js"></script>
</body>
</html>
